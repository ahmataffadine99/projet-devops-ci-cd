name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-scan:
    name: Build, Test and Scan
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 1. BACKEND (PYTHON)
      # ==========================================
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Backend dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv
          source .venv/bin/activate
          uv sync

      - name: 🧹 Run Backend linter
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          # Commande de linter (ex: ruff check .)
          echo "Running Python linter..." || true

      - name: 🧪 Run Backend tests & Generate Report
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          # Commande de test (ex: pytest --junitxml=report.xml)
          echo "Running Python tests..." || true

      # ==========================================
      # 2. FRONTEND (NODE.JS)
      # ==========================================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # On utilise 24 pour la compatibilité avec ESLint 9+

      - name: 📦 Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: 🧹 Run Frontend linter
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: 🧪 Run Frontend tests & Generate Report
        working-directory: ./frontend
        run: npm run test --if-present

      # ==========================================
      # 3. SECURITY SCAN (CODE)
      # ==========================================
      - name: 🛡️ Run Security Scan (Scorecard)
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      # ==========================================
      # 4. DOCKER BUILD & TRIVY SCAN
      # ==========================================
      - name: 🐳 Build Docker image (Backend)
        working-directory: ./backend
        run: docker build -t myapp-backend:latest .

      - name: 🐳 Build Docker image (Frontend)
        working-directory: ./frontend
        run: docker build -t myapp-frontend:latest .

      - name: 🔍 Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myapp-backend:latest'
          format: 'cyclonedx' # Format demandé pour le fichier VEX
          output: 'trivy-backend-vex.json'
          vuln-type: 'os,library'

      # ==========================================
      # 5. PUSH TO REGISTRY (UNIQUEMENT SUR MAIN)
      # ==========================================
      - name: 🚀 Push to Docker Registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "TODO: Configurer les secrets pour se connecter au registre"
          # docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
          # docker push myapp-backend:latest
          # docker push myapp-frontend:latest
