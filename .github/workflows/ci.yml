name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-scan:
    name: Build, Test and Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend dependencies
        working-directory: ./backend
        run: |
          pip install uv
          uv venv
          source .venv/bin/activate
          uv sync

      - name: Run Backend linter
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          uv run ruff check . || echo "Linter failed but continuing"

      - name: Run Backend tests
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          uv run pytest weather/tests/unit --junitxml=test-report.xml

      # Frontend Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend linter
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Run Frontend tests
        working-directory: ./frontend
        run: npm run test:unit --if-present

      # Security Scan
      - name: Run Security Scan
        uses: ossf/scorecard-action@main
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      # Docker build & Trivy scan
      - name: Build Backend Docker Image
        working-directory: ./backend
        run: docker build -t myapp-backend:latest .

      - name: Build Frontend Docker Image
        working-directory: ./frontend
        run: docker build -t myapp-frontend:latest .

      - name: Run Trivy scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myapp-backend:latest'
          format: 'cyclonedx'
          output: 'trivy-backend-vex.json'
          vuln-type: 'os,library'

      - name: Run Trivy scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myapp-frontend:latest'
          format: 'cyclonedx'
          output: 'trivy-frontend-vex.json'
          vuln-type: 'os,library'

      # Registry Push
      - name: Push to Docker Registry (ghcr.io)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag myapp-backend:latest ghcr.io/${{ github.repository }}/myapp-backend:latest
          docker tag myapp-frontend:latest ghcr.io/${{ github.repository }}/myapp-frontend:latest
          docker push ghcr.io/${{ github.repository }}/myapp-backend:latest
          docker push ghcr.io/${{ github.repository }}/myapp-frontend:latest

      # Upload Artifacts
      - name: Upload Deliverable Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-deliverables
          path: |
            backend/test-report.xml
            scorecard-results.sarif
            trivy-backend-vex.json
            trivy-frontend-vex.json
          retention-days: 14
